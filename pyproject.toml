[project]
name = "practice-knn-kmeans"
version = "0.1.0"
description = "Reproducible e-commerce customer segmentation with K-Means"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "ipython>=9.15.0",
    "joblib>=1.5.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "scikit-learn>=1.7.0",
    "scipy>=1.15.0",
    "seaborn>=0.13.2",
]

[project.scripts]
segment = "customer_segmentation.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/customer_segmentation"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["notebook"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
